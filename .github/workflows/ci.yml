name: CI
# CI check: lint, migrations, deploy checks, tests + coverage, Docker build.

on:
  push:
    branches: ["main", "member*/**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cargolink
          POSTGRES_USER: cargolink
          POSTGRES_PASSWORD: cargolink
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cargolink" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      TEST_DATABASE_URL: postgres://cargolink:cargolink@localhost:5432/cargolink
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff (lint + format)
        run: |
          ruff check .
          ruff format --check .
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Django system checks (production settings)
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          SECRET_KEY: ci-only-secret-key-with-enough-length-and-entropy-1234567890
          DATABASE_URL: sqlite:////tmp/ci.db
          ALLOWED_HOSTS: example.com
      - name: Tests + coverage (pytest, ≥ 80 %)
        run: pytest
      - name: Tests (python manage.py test)
        run: python manage.py test
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: htmlcov
          path: htmlcov/

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t cargolink:ci .
