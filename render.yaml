# Render Blueprint — New + > Blueprint > select this repository.
# Creates: PostgreSQL, Key Value (Redis), the Django web service and the Celery worker.
databases:
  - name: cargolink-db
    databaseName: cargolink
    user: cargolink
    plan: free

services:
  - type: keyvalue
    name: cargolink-redis
    plan: free
    ipAllowList: []

  - type: web
    name: cargolink-web
    runtime: python
    plan: free
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py train_ai_models
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cargolink-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: cargolink-redis
          property: connectionString
      - key: AI_PROVIDER
        value: local
      - key: AI_API_KEY
        sync: false

  - type: worker
    name: cargolink-worker
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && python manage.py train_ai_models
    startCommand: celery -A config worker --loglevel=info --concurrency=2
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        fromService:
          type: web
          name: cargolink-web
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: cargolink-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: cargolink-redis
          property: connectionString
      - key: AI_PROVIDER
        value: local
      - key: AI_API_KEY
        sync: false
