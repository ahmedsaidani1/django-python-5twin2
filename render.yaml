# Render Blueprint — FREE plan. New + > Blueprint > select this repository.
# Creates: a free PostgreSQL database and the Django web service.
#
# Free-plan design:
# - No Celery worker and no Redis (background workers are paid). REDIS_URL is not set, so the
#   broker is unreachable and AI jobs run in a background thread: the HTTP request still returns
#   immediately (202) and the browser polls /ai/jobs/<id>/.
# - No shell / pre-deploy command on free instances: migrations and the first demo seed run in
#   the start command (`seed_demo --if-empty` does nothing once the demo admin exists).
# - 1 gunicorn worker with threads to stay within the free instance memory.
# With a paid plan, add a `keyvalue` service, a `worker` running
# `celery -A config worker -l info`, and REDIS_URL on both services.
databases:
  - name: cargolink-db
    databaseName: cargolink
    user: cargolink
    plan: free

services:
  - type: web
    name: cargolink-web
    runtime: python
    plan: free
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py train_ai_models
    startCommand: >-
      python manage.py migrate --noinput &&
      python manage.py seed_demo --if-empty &&
      gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cargolink-db
          property: connectionString
      - key: CONN_MAX_AGE
        value: "0"
      - key: AI_PROVIDER
        value: local
      - key: AI_API_KEY
        sync: false
      - key: MPLCONFIGDIR
        value: /tmp/matplotlib
