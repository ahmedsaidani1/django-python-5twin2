[project]
name = "cargolink"
version = "1.0.0"
description = "CargoLink — marketplace de covoiturage de fret (ESPRIT 5TWIN)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-q --cov=apps --cov=config --cov-report=term-missing:skip-covered --cov-report=html --cov-fail-under=80"
filterwarnings = ["ignore::DeprecationWarning", "ignore:No directory at:UserWarning"]

[tool.coverage.run]
branch = true
omit = [
    "*/migrations/*",
    "*/tests/*",
    "config/wsgi.py",
    "config/asgi.py",
    "config/settings/prod.py",
    "config/settings/dev.py",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*/migrations/*", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ"]
ignore = ["DJ001", "B904", "E501"]  # line length is enforced by `ruff format`
