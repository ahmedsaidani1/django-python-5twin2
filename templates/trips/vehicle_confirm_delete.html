{% extends "base.html" %}
{% block title %}Supprimer le véhicule{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6">
  <div class="card"><div class="card-body p-4">
    <h1 class="h3 section-title">Supprimer le véhicule</h1>
    <p>Supprimer <strong>{{ vehicle }}</strong> ?</p>
    <form method="post">{% csrf_token %}
      <button class="btn btn-danger" type="submit">Oui, supprimer</button>
      <a class="btn btn-outline-primary" href="{% url 'trips:vehicles' %}">Annuler</a>
    </form>
  </div></div>
</div></div>
{% endblock %}
