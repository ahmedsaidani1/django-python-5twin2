{% extends "base.html" %}
{% block title %}Supprimer l'annonce{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6">
  <div class="card"><div class="card-body p-4">
    <h1 class="h3 section-title">Supprimer l'annonce</h1>
    <p>Voulez-vous vraiment supprimer « <strong>{{ freight.title }}</strong> » ? Cette action est définitive.</p>
    <form method="post">{% csrf_token %}
      <button class="btn btn-danger" type="submit">Oui, supprimer</button>
      <a class="btn btn-outline-primary" href="{{ freight.get_absolute_url }}">Annuler</a>
    </form>
  </div></div>
</div></div>
{% endblock %}
